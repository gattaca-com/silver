name: release

# Publishes `v<version>` the first time a push to main carries a workspace
# version that has no release yet. Run it by hand to retry a failed one.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      existing_tag:
        description: "Publish an image for an existing release (for example, v0.1.0-alpha.6)"
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  unreleased-version:
    if: github.repository == 'gattaca-com/silver' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      existing: ${{ steps.tag.outputs.existing }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        env:
          EXISTING_TAG: ${{ inputs.existing_tag }}
        run: |
          if [ -n "$EXISTING_TAG" ]; then
            if [[ ! "$EXISTING_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid Silver release tag: $EXISTING_TAG" >&2
              exit 1
            fi
            git ls-remote --exit-code --tags origin "refs/tags/$EXISTING_TAG" > /dev/null
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  linux-x86_64:
    needs: unreleased-version
    if: needs.unreleased-version.outputs.tag != '' && needs.unreleased-version.outputs.existing != 'true'
    # The oldest supported runner: its glibc sets the floor for users' distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Build
        run: cargo build --profile release-prod --locked --bin silver --bin silver_surfer

      - name: Package
        run: |
          mkdir dist && cd dist
          for bin in silver silver_surfer; do
            cp ../target/release-prod/$bin $bin-linux-x86_64
            sha256sum $bin-linux-x86_64 > $bin-linux-x86_64.sha256
          done
          ./silver-linux-x86_64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/
          if-no-files-found: error

  image:
    needs: [unreleased-version, linux-x86_64]
    if: >-
      !cancelled() && needs.unreleased-version.outputs.tag != '' &&
      (needs.linux-x86_64.result == 'success' || needs.unreleased-version.outputs.existing == 'true')
    runs-on: [self-hosted, silver]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/gattaca-com/silver
      TAG: ${{ needs.unreleased-version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.unreleased-version.outputs.existing != 'true'
        with:
          name: linux-x86_64
          path: dist/

      - name: Download existing release binaries
        if: needs.unreleased-version.outputs.existing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The checksums are release assets too, so only the attestation proves this workflow built the binaries.
        run: |
          gh release download "$TAG" --dir dist --pattern '*-linux-x86_64' --pattern '*-linux-x86_64.sha256'
          cd dist
          sha256sum --check ./*.sha256
          for bin in ./*-linux-x86_64; do
            gh attestation verify "$bin" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yaml"
          done

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: dist
          file: Dockerfile
          target: release
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: org.opencontainers.image.version=${{ env.TAG }}

      - name: Smoke-test image
        run: |
          docker run --rm --network none "$IMAGE:$TAG" --version
          docker run --rm --network none "$IMAGE:$TAG" --help
          docker run --rm --network none --entrypoint /usr/bin/test "$IMAGE:$TAG" -x /usr/local/bin/silver_surfer
          container=$(docker create "$IMAGE:$TAG")
          trap 'docker rm "$container" > /dev/null' EXIT
          for bin in silver silver_surfer; do
            docker cp "$container:/usr/local/bin/$bin" "packaged-$bin"
            cmp "dist/$bin-linux-x86_64" "packaged-$bin"
          done

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        id: push
        run: |
          docker push "$IMAGE:$TAG"
          repo_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")
          echo "digest=${repo_digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  chart:
    needs: [unreleased-version, image]
    if: '!cancelled() && needs.image.result == ''success'''
    runs-on: [self-hosted, silver]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.unreleased-version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      # Self-hosted home directories persist, so the registry login must not land there.
      - name: Publish chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          helm lint --strict charts/silver
          helm package charts/silver --version "${TAG#v}" --app-version "$TAG" --destination "$RUNNER_TEMP/chart"
          export HELM_REGISTRY_CONFIG="$RUNNER_TEMP/helm-registry.json"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP"/chart/silver-*.tgz oci://ghcr.io/gattaca-com/charts

  publish:
    needs: [unreleased-version, linux-x86_64, image, chart]
    if: '!cancelled() && needs.chart.result == ''success'''
    runs-on: [self-hosted, silver]
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # Self-hosted workspaces persist, and nothing here checks out a fresh one.
      - run: rm -rf dist

      - uses: actions/download-artifact@v4
        if: needs.unreleased-version.outputs.existing != 'true'
        with:
          name: linux-x86_64
          path: dist/

      - name: Attest
        if: needs.unreleased-version.outputs.existing != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*-linux-x86_64

      # Creates the tag at this commit, so a failed build leaves no tag behind.
      - name: Publish
        if: needs.unreleased-version.outputs.existing != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.unreleased-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            <!-- silver-container -->
            ## Container image

            Linux amd64: `docker pull ghcr.io/gattaca-com/silver:${{ needs.unreleased-version.outputs.tag }}`

            Digest: `${{ needs.image.outputs.digest }}`

            [GitHub package](https://github.com/gattaca-com/silver/pkgs/container/silver)
            <!-- /silver-container -->

      - name: Link image from existing release
        if: needs.unreleased-version.outputs.existing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.unreleased-version.outputs.tag }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          gh release view "$TAG" --json body --jq .body > release-notes.md
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("release-notes.md")
          body = path.read_text()
          start = "<!-- silver-container -->"
          end = "<!-- /silver-container -->"
          if start in body and end in body:
              before, rest = body.split(start, 1)
              _, after = rest.split(end, 1)
              body = before.rstrip() + after
          image = f"ghcr.io/gattaca-com/silver:{os.environ['TAG']}"
          body = body.rstrip() + f"\n\n{start}\n## Container image\n\n"
          body += f"Linux amd64: `docker pull {image}`\n\n"
          body += f"Digest: `{os.environ['IMAGE_DIGEST']}`\n\n"
          body += "[GitHub package](https://github.com/gattaca-com/silver/pkgs/container/silver)\n"
          path.write_text(body + f"{end}\n")
          PY
          gh release edit "$TAG" --notes-file release-notes.md
