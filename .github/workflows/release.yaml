name: release

# Publishes `v<version>` the first time a push to main carries a workspace
# version that has no release yet. Run it by hand to retry a failed one.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      existing_tag:
        description: "Publish an image for an existing release (for example, v0.1.0-alpha.6)"
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  unreleased-version:
    if: github.repository == 'gattaca-com/silver' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      existing: ${{ steps.tag.outputs.existing }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        env:
          EXISTING_TAG: ${{ inputs.existing_tag }}
        run: |
          if [ -n "$EXISTING_TAG" ]; then
            if [[ ! "$EXISTING_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid Silver release tag: $EXISTING_TAG" >&2
              exit 1
            fi
            git ls-remote --exit-code --tags origin "refs/tags/$EXISTING_TAG" > /dev/null
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: unreleased-version
    if: needs.unreleased-version.outputs.tag != '' && needs.unreleased-version.outputs.existing != 'true'
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    # The oldest supported runners: their glibc sets the floor for users' distros.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0

      - name: Build
        run: cargo build --profile release-prod --locked --bin silver --bin silver_surfer --bin silver_telemetry

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir dist && cd dist
          for bin in silver silver_surfer silver_telemetry; do
            cp "../target/release-prod/$bin" "$bin-linux-$ARCH"
            sha256sum "$bin-linux-$ARCH" > "$bin-linux-$ARCH.sha256"
          done
          "./silver-linux-$ARCH" --version
          "./silver_telemetry-linux-$ARCH" --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  image:
    needs: [unreleased-version, linux]
    if: >-
      !cancelled() && needs.unreleased-version.outputs.tag != '' &&
      (needs.linux.result == 'success' || needs.unreleased-version.outputs.existing == 'true')
    runs-on: [self-hosted, silver]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/gattaca-com/silver
      TAG: ${{ needs.unreleased-version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.unreleased-version.outputs.existing != 'true'
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist/

      # Releases before aarch64 builds carry x86_64 assets only.
      - name: Download existing release binaries
        if: needs.unreleased-version.outputs.existing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The checksums are release assets too, so only the attestation proves this workflow built the binaries.
        run: |
          gh release download "$TAG" --dir dist --pattern '*-linux-x86_64*' --pattern '*-linux-aarch64*'
          cd dist
          sha256sum --check ./*.sha256
          for bin in ./*-linux-x86_64 ./*-linux-aarch64; do
            [ -e "$bin" ] || continue
            gh attestation verify "$bin" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yaml"
          done

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: hashFiles('dist/silver-linux-aarch64') != ''
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build amd64 release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: dist
          file: Dockerfile
          target: release
          platforms: linux/amd64
          build-args: BIN_ARCH=x86_64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-amd64
          labels: org.opencontainers.image.version=${{ env.TAG }}

      - name: Build arm64 release image
        if: hashFiles('dist/silver-linux-aarch64') != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: dist
          file: Dockerfile
          target: release
          platforms: linux/arm64
          build-args: BIN_ARCH=aarch64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-arm64
          labels: org.opencontainers.image.version=${{ env.TAG }}

      # arm64 runs under QEMU.
      - name: Smoke-test images
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            platform=${pair%:*} arch=${pair#*:}
            [ -e "dist/silver-linux-$arch" ] || continue
            image="$IMAGE:$TAG-$platform"
            run="docker run --rm --network none --platform linux/$platform"
            $run "$image" --version
            $run "$image" --help
            $run --entrypoint /usr/bin/test "$image" -x /usr/local/bin/silver_surfer
            container=$(docker create --platform "linux/$platform" "$image")
            for bin in silver silver_surfer; do
              docker cp "$container:/usr/local/bin/$bin" "packaged-$bin"
              cmp "dist/$bin-linux-$arch" "packaged-$bin"
            done
            docker rm "$container" > /dev/null
          done

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The per-platform tags are pushed so the index can reference them.
      # Only a new release moves `latest`; republishing an old one must not.
      - name: Publish tested image
        id: push
        env:
          EXISTING: ${{ needs.unreleased-version.outputs.existing }}
        run: |
          sources=()
          for pair in amd64:x86_64 arm64:aarch64; do
            platform=${pair%:*} arch=${pair#*:}
            [ -e "dist/silver-linux-$arch" ] || continue
            docker push "$IMAGE:$TAG-$platform"
            sources+=("$IMAGE:$TAG-$platform")
          done
          tags=(--tag "$IMAGE:$TAG")
          if [ "$EXISTING" != true ]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  chart:
    needs: [unreleased-version, image]
    if: '!cancelled() && needs.image.result == ''success'''
    runs-on: [self-hosted, silver]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.unreleased-version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      # Self-hosted home directories persist, so the registry login must not land there.
      - name: Publish chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          helm lint --strict charts/silver
          helm package charts/silver --version "${TAG#v}" --app-version "$TAG" --destination "$RUNNER_TEMP/chart"
          export HELM_REGISTRY_CONFIG="$RUNNER_TEMP/helm-registry.json"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP"/chart/silver-*.tgz oci://ghcr.io/gattaca-com/charts

  publish:
    needs: [unreleased-version, linux, image, chart]
    if: '!cancelled() && needs.chart.result == ''success'''
    runs-on: [self-hosted, silver]
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # Self-hosted workspaces persist, and nothing here checks out a fresh one.
      - run: rm -rf dist

      - uses: actions/download-artifact@v4
        if: needs.unreleased-version.outputs.existing != 'true'
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist/

      - name: Attest
        if: needs.unreleased-version.outputs.existing != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*-linux-x86_64
            dist/*-linux-aarch64

      # Creates the tag at this commit, so a failed build leaves no tag behind.
      - name: Publish
        if: needs.unreleased-version.outputs.existing != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.unreleased-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            <!-- silver-container -->
            ## Container image

            Linux amd64 and arm64: `docker pull ghcr.io/gattaca-com/silver:${{ needs.unreleased-version.outputs.tag }}`

            Digest: `${{ needs.image.outputs.digest }}`

            [GitHub package](https://github.com/gattaca-com/silver/pkgs/container/silver)
            <!-- /silver-container -->

      - name: Link image from existing release
        if: needs.unreleased-version.outputs.existing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.unreleased-version.outputs.tag }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          gh release view "$TAG" --json body --jq .body > release-notes.md
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("release-notes.md")
          body = path.read_text()
          start = "<!-- silver-container -->"
          end = "<!-- /silver-container -->"
          if start in body and end in body:
              before, rest = body.split(start, 1)
              _, after = rest.split(end, 1)
              body = before.rstrip() + after
          image = f"ghcr.io/gattaca-com/silver:{os.environ['TAG']}"
          body = body.rstrip() + f"\n\n{start}\n## Container image\n\n"
          body += f"Linux amd64: `docker pull {image}`\n\n"
          body += f"Digest: `{os.environ['IMAGE_DIGEST']}`\n\n"
          body += "[GitHub package](https://github.com/gattaca-com/silver/pkgs/container/silver)\n"
          path.write_text(body + f"{end}\n")
          PY
          gh release edit "$TAG" --notes-file release-notes.md
