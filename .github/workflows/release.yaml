name: release

# Publishes `v<version>` the first time a push to main carries a workspace
# version that has no release yet. Run it by hand to retry a failed one.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  unreleased-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          tag="v$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  linux-x86_64:
    needs: unreleased-version
    if: needs.unreleased-version.outputs.tag != ''
    # The oldest supported runner: its glibc sets the floor for users' distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Build
        run: cargo build --profile release-prod --locked --bin silver --bin silver_surfer

      - name: Package
        run: |
          mkdir dist && cd dist
          for bin in silver silver_surfer; do
            cp ../target/release-prod/$bin $bin-linux-x86_64
            sha256sum $bin-linux-x86_64 > $bin-linux-x86_64.sha256
          done
          ./silver-linux-x86_64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/
          if-no-files-found: error

  publish:
    needs: [unreleased-version, linux-x86_64]
    runs-on: [self-hosted, silver]
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # Self-hosted workspaces persist, and nothing here checks out a fresh one.
      - run: rm -rf dist

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist/

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*-linux-x86_64

      # Creates the tag at this commit, so a failed build leaves no tag behind.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.unreleased-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
