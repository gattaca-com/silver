name: crypto_simd proof

# Branch protection requires only the `proof` job. The workflow runs on every
# pull request so that `proof` always reports: a workflow filtered out by `paths`
# never reports, and a required check that never reports blocks the merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PROOF_DIR: crates/crypto_simd/proof/lean

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      crypto_simd: ${{ steps.diff.outputs.crypto_simd }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the dependency change check
        run: python3 -I -m unittest discover -s .github/scripts -p crypto_simd_deps_changed.py

      # A base that is missing or unreadable counts as a change: the proof runs
      # rather than being skipped.
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=true
          elif git diff --name-only "$BASE" HEAD -- \
              crates/crypto_simd .github/workflows/crypto_simd_proof.yaml \
              .github/scripts/crypto_simd_deps_changed.py |
              grep -q .; then
            changed=true
          else
            git show "$BASE:Cargo.lock" >"$RUNNER_TEMP/base.lock"
            changed=$(python3 -I .github/scripts/crypto_simd_deps_changed.py "$RUNNER_TEMP/base.lock" Cargo.lock)
          fi
          echo "crypto_simd=$changed" >>"$GITHUB_OUTPUT"

  extraction:
    needs: changes
    if: needs.changes.outputs.crypto_simd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: pins
        run: |
          aeneas=$(python3 -I -c 'import json, sys
          print(next(p["rev"] for p in json.load(open(sys.argv[1]))["packages"] if p["name"] == "aeneas"))' \
            "$PROOF_DIR/lake-manifest.json")
          [[ $aeneas =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected Aeneas pin: $aeneas" >&2; exit 1; }
          echo "aeneas=$aeneas" >>"$GITHUB_OUTPUT"

      # Charon's driver links the nightly's librustc_driver, so the toolchain is
      # cached with the binaries.
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/aeneas
            ~/.rustup/toolchains/nightly-*-x86_64-unknown-linux-gnu
          key: aeneas-${{ steps.pins.outputs.aeneas }}-v1

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.3"

      # Charon's `make build` runs `cargo fmt` and builds charon-ml's
      # documentation, hence rustfmt and odoc. setup-ocaml creates a local
      # switch in the workspace, which opam cannot find from ~/aeneas unless
      # OPAMSWITCH names it.
      - name: Build the pinned Aeneas and Charon
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          AENEAS_REV: ${{ steps.pins.outputs.aeneas }}
          OPAMSWITCH: ${{ github.workspace }}
        run: |
          opam install -y ppx_deriving visitors easy_logging zarith yojson core_unix \
            odoc ocamlgraph menhir unionFind progress domainslib
          git clone https://github.com/AeneasVerif/aeneas ~/aeneas
          cd ~/aeneas
          git checkout "$AENEAS_REV"
          git clone https://github.com/AeneasVerif/charon charon
          git -C charon checkout "$(tail -n 1 charon-pin)"
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' charon/rust-toolchain)
          rustup toolchain install "$channel" --profile minimal --component rustfmt
          opam exec -- make -C charon build
          opam exec -- make build-bin-dir

      - name: Check the extraction for drift
        working-directory: ${{ env.PROOF_DIR }}
        run: |
          AENEAS_DIR="$HOME/aeneas" ./extract.sh --check
          python3 -I controls/extraction-check.py

  lean:
    needs: changes
    if: needs.changes.outputs.crypto_simd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Runs `lake exe cache get` and `lake build`, whose axiom guard fails the
      # build on any axiom beyond propext, Classical.choice and Quot.sound.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: ${{ env.PROOF_DIR }}

      - name: Negative and concrete controls
        working-directory: ${{ env.PROOF_DIR }}
        run: |
          for f in controls/*.lean; do
            echo "::group::$f"
            lake env lean -DautoImplicit=false -DrelaxedAutoImplicit=false "$f"
            echo "::endgroup::"
          done

      - name: Downstream package
        working-directory: ${{ env.PROOF_DIR }}/controls/downstream
        run: lake update && lake build

      - name: Differential vector test
        working-directory: ${{ env.PROOF_DIR }}
        run: |
          lake build differential
          lake exe differential ../decompress_g2_vectors.txt --g1 ../decompress_g1_vectors.txt
          python3 -I Test/check_g1_controls.py

  rust:
    needs: changes
    if: needs.changes.outputs.crypto_simd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: cpu
        run: |
          if grep -qw avx512ifma /proc/cpuinfo && grep -qw avx512f /proc/cpuinfo; then
            echo "ifma=true" >>"$GITHUB_OUTPUT"
          else
            echo "ifma=false" >>"$GITHUB_OUTPUT"
            echo "::notice::No AVX-512 IFMA; Rust tests will run with kernel replay skipped."
          fi

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-15
        with:
          toolchain: nightly-2026-06-21

      # Run BLS and KZG tests. On IFMA hosts, require SIMD acceleration to be present, so that
      # a missing kernel fails the test. On non-IFMA hosts, skip the SIMD replay tests.
      - name: Run BLS replay and KZG tests
        env:
          IFMA: ${{ steps.cpu.outputs.ifma }}
        run: |
          make -C crates/crypto_simd
          if [[ $IFMA == true ]]; then export SILVER_REQUIRE_IFMA=1; fi
          cargo test --locked -p silver_crypto_simd --all-features

  # The required check covers extraction, Lean and Rust. Skips pass only when
  # `changes` found no relevant edit; a failed or cancelled `changes` fails here.
  proof:
    needs: [changes, extraction, lean, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.crypto_simd }}
          RESULTS: ${{ needs.extraction.result }} ${{ needs.lean.result }} ${{ needs.rust.result }}
        run: |
          echo "changes=$CHANGES relevant=$RELEVANT results=$RESULTS"
          [[ $CHANGES == success ]] || exit 1
          case $RELEVANT in
            true) [[ $RESULTS == "success success success" ]] ;;
            false) [[ $RESULTS == "skipped skipped skipped" ]] ;;
            *) exit 1 ;;
          esac
