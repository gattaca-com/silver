name: docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yaml
      - .github/workflows/release.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        include:
          - { arch: x86_64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build from source
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: silver:source
          build-args: SILVER_BUILD_COMMIT=${{ github.sha }}

      - name: Smoke-test and extract binaries
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --network none silver:source --version
          docker run --rm --network none silver:source --help
          mkdir dist
          container=$(docker create silver:source)
          trap 'docker rm "$container" > /dev/null' EXIT
          for bin in silver silver_surfer; do
            docker cp "$container:/usr/local/bin/$bin" "dist/$bin-linux-$ARCH"
            test -x "dist/$bin-linux-$ARCH"
          done

      - name: Package release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: dist
          file: Dockerfile
          target: release
          platforms: ${{ matrix.platform }}
          load: true
          build-args: BIN_ARCH=${{ matrix.arch }}
          tags: silver:release

      - name: Smoke-test release image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --network none silver:release --version
          docker run --rm --network none silver:release --help
          container=$(docker create silver:release)
          trap 'docker rm "$container" > /dev/null' EXIT
          for bin in silver silver_surfer; do
            docker cp "$container:/usr/local/bin/$bin" "packaged-$bin"
            test -x "packaged-$bin"
            cmp "dist/$bin-linux-$ARCH" "packaged-$bin"
          done
