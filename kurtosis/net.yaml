# Kurtosis ethereum-package args for a local Fulu/PeerDAS devnet to test
# silver peer-connection behaviour against real, log-readable CL clients.
#
#   kurtosis run github.com/ethpandaops/ethereum-package --args-file kurtosis/net.yaml
#
# silver runs as a BARE HOST PROCESS and joins this enclave over the Docker
# bridge (see kurtosis/README wiring steps). Containers, not VMs.
#
# Constraints baked in for silver compatibility:
#   - preset: mainnet  -> matches silver's default SpecConfig (minimal would
#     break slot/epoch assumptions).
#   - all forks at genesis through Fulu -> PeerDAS (data columns) active from
#     slot 0, matching the Fulu-only fork scope.
#   - lighthouse-heavy participant set: silver is QUIC-only and dials a peer
#     ONLY if its ENR advertises a quic socket. Lighthouse enables QUIC by
#     default. Verify any other client actually advertises `quic` in its ENR,
#     else silver logs "Peer does not support quic" and skips it.

participants:
  # Three lighthouse nodes on distinct ELs -> guaranteed QUIC peers + EL
  # diversity. These are silver's reliable counterparties.
  #
  # Scoring visibility: `global_log_level: debug` covers lighthouse's peer
  # manager (score-driven disconnects, bans, goodbyes-with-reason). The
  # gossipsub-internal penalties (graft-in-backoff, IWANT flood, invalid
  # message rejects) log under the gossipsub tracing target -- enabled via
  # RUST_LOG below. Per-peer live scores (incl. silver's) need no flag:
  # GET /lighthouse/peers on each node's HTTP API.
  - el_type: geth
    cl_type: lighthouse
    cl_extra_params:
      - --target-peers=64
    cl_extra_env_vars:
      RUST_LOG: "gossipsub=debug,libp2p_gossipsub=debug"
    count: 1
  - el_type: reth
    cl_type: lighthouse
    cl_extra_params:
      - --target-peers=64
    cl_extra_env_vars:
      RUST_LOG: "gossipsub=debug,libp2p_gossipsub=debug"
    count: 1
  - el_type: nethermind
    cl_type: lighthouse
    cl_extra_params:
      - --target-peers=64
    cl_extra_env_vars:
      RUST_LOG: "gossipsub=debug,libp2p_gossipsub=debug"
    count: 1
  # One non-lighthouse CL for protocol-diversity in disconnect/scoring/goodbye
  # behaviour. Confirm it advertises QUIC; if not, silver will skip it (which
  # is itself a useful observation in your new logs).
  #
  # Prysm at debug logs per-message validation results ("could not
  # validate...") -- the fastest check that silver's (re)published columns are
  # accepted -- and its own scorer's "disconnecting bad peer". go-libp2p does
  # NOT log gossipsub penalties; per-peer scores come from the debug RPC
  # endpoints enabled below.
  - el_type: geth
    cl_type: prysm
    count: 1

network_params:
  preset: mainnet
  seconds_per_slot: 12
  # Fulu/PeerDAS refuses to start unless data columns are servable: it requires
  # a supernode, a node with 128+ validators (full custody), or
  # perfect_peerdas_enabled (needs 16 participants). 128 keys/node gives every
  # node full custody -> columns always available for a light node like silver.
  num_validator_keys_per_node: 128
  # Small genesis delay so the chain starts promptly; read the resulting
  # genesis time from the CL genesis API for silver's genesis_unix_secs.
  genesis_delay: 20
  # Fork schedule: everything live at genesis through Fulu. Pre-Deneb forks
  # default to epoch 0 in kurtosis devnets. NOTE: exact key names track spec
  # churn -- verify against the package version you pull (network_params
  # schema / README). `fulu_fork_epoch` is the current PeerDAS activation knob.
  deneb_fork_epoch: 0
  electra_fork_epoch: 0
  fulu_fork_epoch: 0

# CL at debug so you can correlate the *peer's* account of a disconnect /
# goodbye / score change against silver's new lifecycle logs, same wall clock.
global_log_level: debug

# dora = lightweight block explorer to confirm the chain is producing and
# finalizing. spamoor = tx/blob spammer; the `blobs` scenario submits EIP-4844
# blob transactions so blocks carry `kzg_commitments` -> CLs produce
# DataColumnSidecars (PeerDAS). Without it a vanilla devnet has no blobs and
# therefore no data columns to sync/backfill/validate.
additional_services:
  - dora
  - spamoor
  # prometheus scrapes every CL's metrics endpoint: lighthouse exports
  # gossipsub score distributions + ban/disconnect counters -- the trend view
  # that log lines can't give.
  - prometheus_grafana

# Blob spammer config. NOTE: service name (`spamoor`), scenario (`blobs`), and
# keys (`throughput`/`sidecars`) are verified against ethereum-package @6.1.0 +
# spamoor; re-check if you bump the package. throughput = blob txs per slot,
# sidecars = blobs per tx (devnet BLOB_SCHEDULE caps at max_blobs_per_block).
# Uses the genesis-prefunded account automatically.
spamoor_params:
  spammers:
    - scenario: blobs
      name: blob-spammer
      config:
        throughput: 2
        sidecars: 3
