name = "lean_bls_simd"
defaultTargets = ["LeanBlsSimd"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The tag that cryptography-specs pins.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.1"

[[require]]
name = "EthCryptographySpecs"
git = "https://github.com/ethereum/cryptography-specs"
rev = "d1331f02e308fe6d0aedda8601e4d5b0fc360318"

# The Aeneas release whose Charon and Aeneas generate `LeanBlsSimd/Extracted/`.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "d973341320c1d5c947a95992db2aa6f70b658ea2"
subDir = "backends/lean"

[[lean_lib]]
name = "LeanBlsSimd"

[[lean_lib]]
name = "Differential"
srcDir = "Test"
globs = ["Differential.+"]

# Not a default target: `lake build` does not need it. Run it with
# `lake exe differential ../decompress_g2_vectors.txt --g1 ../decompress_g1_vectors.txt`.
[[lean_exe]]
name = "differential"
root = "Test.Main"
