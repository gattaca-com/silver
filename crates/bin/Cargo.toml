[package]
name = "silver"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
silver_beacon_state.workspace = true
silver_beacon_state_data.workspace = true
silver_common.workspace = true
silver_config.workspace = true
silver_control.workspace = true
silver_discovery.workspace = true
silver_gossip.workspace = true
silver_network.workspace = true
silver_peer.workspace = true
silver_storage.workspace = true
silver_engine.workspace = true

clap.workspace = true
flux.workspace = true
hex.workspace = true
mimalloc.workspace = true
quinn-proto.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[features]
alloc-profile = ["silver_common/alloc-profile"]
# #[perf] collection: per-function instructions-retired + CPU cycles on
# perf-{fn} queues (dev; needs `sudo sysctl kernel.perf_event_paranoid=2`).
# Surfer picks the queues up when present; non-perf builds are unaffected.
perf = ["silver_common/perf"]
