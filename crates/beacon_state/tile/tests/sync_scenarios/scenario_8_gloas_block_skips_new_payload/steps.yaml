# Scenario 8: a Gloas block carries no execution payload, so importing it sends
# only an FCU. The payload goes to the EL once its envelope arrives.
#
# Source: EF gloas fork_choice on_block_parent_full_accepts_verified_payload.
# Block 2 builds on block 1's FULL payload.

startup_checkpoint: tests/mainnet/gloas/fork_choice/on_block/pyspec_tests/on_block_parent_full_accepts_verified_payload/anchor_state.ssz_snappy
gloas: true
slots_missing: 3

steps:
  - kind: sync_target
    target: syncing_head
    target_slot: 2
  - kind: step
  - kind: check
    outbound_has: []

  - kind: blocks_range_resp
    from: tests/mainnet/gloas/fork_choice/on_block/pyspec_tests/on_block_parent_full_accepts_verified_payload/block_0x76bf14e70fc96a5a3442a46dff3bfb897d5568cdb4dc7e94419f625df2fcd9e5.ssz_snappy
  - kind: step
  - kind: check
    outbound_has: [block_applied, fcu]
    outbound_lacks: [new_payload, new_payload_envelope]

  - kind: envelope_resp
    from: tests/mainnet/gloas/fork_choice/on_block/pyspec_tests/on_block_parent_full_accepts_verified_payload/execution_payload_envelope_0x240ec2c17454f3e653fd3b43961e3c9a16770d336b0e882535c01f99b9223b41.ssz_snappy
  - kind: step
  - kind: check
    outbound_has: [new_payload_envelope]
    outbound_lacks: [new_payload, envelope_available]

  # Persisted and announced only once the EL has not rejected it.
  - kind: engine_verdict
    block_root: "0x76bf14e70fc96a5a3442a46dff3bfb897d5568cdb4dc7e94419f625df2fcd9e5"
    status: valid
  - kind: step
  - kind: check
    outbound_has: [envelope_available]

  - kind: blocks_range_resp
    from: tests/mainnet/gloas/fork_choice/on_block/pyspec_tests/on_block_parent_full_accepts_verified_payload/block_0x7a25db19479cdcc24bd59bb8f5feaeee2e9b24bd25f5eddd54dd809c567b5e5b.ssz_snappy
  - kind: step
  - kind: check
    outbound_has: [block_applied, fcu]
    outbound_lacks: [new_payload, block_rejected]
