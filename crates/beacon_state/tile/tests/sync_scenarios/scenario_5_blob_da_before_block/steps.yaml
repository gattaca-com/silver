# Scenario 5: the columns of a blob-carrying block are available before the
# block itself arrives. The block imports on arrival; nothing is staged.
#
# Source: EF's sanity/blocks/one_blob case — same fixtures as scenario 2.

startup_checkpoint: tests/mainnet/fulu/sanity/blocks/pyspec_tests/one_blob/pre.ssz_snappy
# checkpoint is at slot 32; the single block is slot 33. wall_slot = 65 keeps
# us in Syncing and well ahead of the block slot.
slots_missing: 33

steps:
  - kind: sync_target
    target: syncing_head
    target_slot: 65
  - kind: step

  - kind: data_columns_available
    from: tests/mainnet/fulu/sanity/blocks/pyspec_tests/one_blob/blocks_0.ssz_snappy
  - kind: step

  - kind: blocks_range_resp
    from: tests/mainnet/fulu/sanity/blocks/pyspec_tests/one_blob/blocks_0.ssz_snappy
  - kind: step
  - kind: check
    outbound_has: [block_applied, persist_block, status]
    outbound_lacks: [block_staged]

  - kind: state_root_matches
    from: tests/mainnet/fulu/sanity/blocks/pyspec_tests/one_blob/post.ssz_snappy
