# Scenario 7: a range-synced blob block is staged on its columns, and the RPC
# ring turns over before they arrive. The block is held only by its ring
# handle, so it is gone when DataColumnsAvailable lands: the tile must ask for
# it again (request_block) and import the re-delivered copy on arrival,
# without staging it a second time.
#
# Source: EF's sanity/blocks/one_blob case — same fixtures as scenario 5.

startup_checkpoint: tests/mainnet/fulu/sanity/blocks/pyspec_tests/one_blob/pre.ssz_snappy
slots_missing: 33

steps:
  - kind: sync_target
    target: syncing_head
    target_slot: 65
  - kind: step

  - kind: blocks_range_resp
    from: tests/mainnet/fulu/sanity/blocks/pyspec_tests/one_blob/blocks_0.ssz_snappy
  - kind: step
  - kind: check
    outbound_has: [block_staged]
    outbound_lacks: [block_applied, persist_block]

  - kind: lap_rpc_ring

  - kind: data_columns_available
    from: tests/mainnet/fulu/sanity/blocks/pyspec_tests/one_blob/blocks_0.ssz_snappy
  - kind: step
  - kind: check
    outbound_has: [request_block]
    outbound_lacks: [block_applied, persist_block]

  - kind: blocks_range_resp
    from: tests/mainnet/fulu/sanity/blocks/pyspec_tests/one_blob/blocks_0.ssz_snappy
  - kind: step
  - kind: check
    outbound_has: [block_applied, persist_block]
    outbound_lacks: [block_staged, request_block]

  - kind: state_root_matches
    from: tests/mainnet/fulu/sanity/blocks/pyspec_tests/one_blob/post.ssz_snappy
