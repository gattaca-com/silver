name = "lean_bls_simd"
defaultTargets = ["LeanBlsSimd", "controls.KzgStrictAxioms", "controls.Refines", "controls.AxiomInventory", "controls.AxiomInventoryDropped", "controls.GuardImported"]
# Mathlib and Aeneas use the module system; most of this package does not.
allowNonModules = true

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The tag that EthLib pins.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "EthLib"
git = "https://github.com/ethereum/EthLib"
rev = "98395150e9eb6a11fd85022bee7ea9da9a8e3760"

# The Aeneas release whose Charon and Aeneas generate `LeanBlsSimd/Extracted/`.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "nightly-2026.10.30-de16f3c"
subDir = "backends/lean"

[[lean_lib]]
name = "LeanBlsSimd"

[[lean_lib]]
name = "controls"

[[lean_lib]]
name = "Differential"
srcDir = "Test"
globs = ["Differential.+"]

# Not a default target: `lake build` does not need it. Run it with
# `lake exe differential ../decompress_g2_vectors.txt --g1 ../decompress_g1_vectors.txt`.
[[lean_exe]]
name = "differential"
root = "Test.Main"
