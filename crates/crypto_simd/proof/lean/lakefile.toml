name = "lean_bls_simd"
defaultTargets = ["LeanBlsSimd", "controls.KzgStrictAxioms", "controls.Refines"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The tag that EthLib pins.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.1"

# total-pairing-definitions: total powers and a structurally recursive Miller loop.
[[require]]
name = "EthLib"
git = "https://github.com/gattaca-com/EthLib"
rev = "5d7ab0f648619d29da9637f8bd57b5e5aa093865"

# The Aeneas release whose Charon and Aeneas generate `LeanBlsSimd/Extracted/`.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "d973341320c1d5c947a95992db2aa6f70b658ea2"
subDir = "backends/lean"

[[lean_lib]]
name = "LeanBlsSimd"

[[lean_lib]]
name = "controls"

[[lean_lib]]
name = "Differential"
srcDir = "Test"
globs = ["Differential.+"]

# Not a default target: `lake build` does not need it. Run it with
# `lake exe differential ../decompress_g2_vectors.txt --g1 ../decompress_g1_vectors.txt`.
[[lean_exe]]
name = "differential"
root = "Test.Main"
