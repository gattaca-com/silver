[package]
name = "silver_crypto_simd"
description = "BLS12-381 and KZG primitives for Ethereum consensus, optimized for modern x86-64 CPUs with AVX-512 IFMA"
edition.workspace = true
exclude = ["proof/"]
license = "MIT"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[features]
default = ["simd"]
simd = []
# Tests against the reference vectors that `make -C crates/crypto_simd` fetches.
spec_vectors = []

[dependencies]
# Not the workspace's blst: its `no-threads` would reach every consumer's blst.
blst = "0.3.16"

[dev-dependencies]
c-kzg.workspace = true
rand.workspace = true
rand_chacha.workspace = true

[[test]]
name = "proof_vectors"
path = "proof/vectors.rs"

[lints]
workspace = true
