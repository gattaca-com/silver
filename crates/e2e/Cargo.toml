[package]
name = "silver_e2e"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
buffa.workspace = true
flux.workspace = true
hdrhistogram.workspace = true
mimalloc.workspace = true
hex.workspace = true
quinn-proto.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
silver_beacon_state.workspace = true
silver_common.workspace = true
silver_control.workspace = true
silver_discovery.workspace = true
silver_gossip.workspace = true
silver_network.workspace = true
silver_peer.workspace = true
snap.workspace = true
tempfile = "3"
tracing.workspace = true
tracing-subscriber.workspace = true

# Optional — `lh-client` brings up a rust-libp2p test peer for end-to-end
# wire-format checks. Heavy dep tree, kept off the default build.
futures = { version = "0.3", optional = true }
libp2p = { version = "0.56", default-features = false, features = [
    "quic",
    "tokio",
    "secp256k1",
    "macros",
    "request-response",
    "gossipsub",
    "identify",
], optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt", "time", "macros"], optional = true }

[dev-dependencies]
silver_common = { workspace = true, features = ["small-validator-cap"] }

[features]
default = []
lh-client = ["dep:futures", "dep:libp2p", "dep:tokio", "dep:async-trait"]
alloc-profile = ["silver_common/alloc-profile"]

[[example]]
name = "gossip_oneway"

[[example]]
name = "gossip_oneway_lh"
required-features = ["lh-client"]

[[example]]
name = "gossip_oneway_lh_b"
required-features = ["lh-client"]

[[example]]
name = "gossip_oneway_lh_c"
required-features = ["lh-client"]

[[test]]
name = "lh_handshake"
required-features = ["lh-client"]

[[test]]
name = "lh_rpc"
required-features = ["lh-client"]

[[test]]
name = "lh_identify"
required-features = ["lh-client"]

[lints]
workspace = true
