[package]
name = "silver_metrics"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
silver_common_macros.workspace = true
flux.workspace = true
libc.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = { workspace = true, optional = true }

[lints]
workspace = true

[features]
# `#[timed]`'s hardware-counter dimension: per-call counters via rdpmc
# (hw_counter), emitted on perf-{fn} queues. Needs
# kernel.perf_event_paranoid <= 2 at runtime (<= 1 to include kernel-mode
# work in the counts):
#   sudo sysctl kernel.perf_event_paranoid=1
# Disabled with a warn otherwise. `PerfSample` and the `#[timed]` macro
# compile regardless — counter collection alone is gated.
perf = ["dep:tracing"]
