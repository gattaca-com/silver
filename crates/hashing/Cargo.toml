[package]
name = "silver_hashing"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# Compiles every `#[timed]` frame out. Feature unification makes it apply to
# every crate in the build that uses flux-profiler.
disable-profiling = ["flux-profiler/disable-profiling"]

[dependencies]
bytesize.workspace = true
flux-profiler.workspace = true
hashtree-rs.workspace = true
sha2-const-stable.workspace = true

[lints]
workspace = true
