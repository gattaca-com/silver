apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "silver.fullname" . }}-entrypoint
  labels:
    {{- include "silver.labels" . | nindent 4 }}
data:
  entrypoint.sh: |-
    #!/bin/sh
    set -eu

    {{- if .Values.externalIP.enabled }}
    external_ip="$(cat /network/external-ip)"
    printf 'external_ip_v4 = "%s"\n' "$external_ip" > /runtime/config.toml
    cat /config/config.toml >> /runtime/config.toml
    {{- else }}
    cp /config/config.toml /runtime/config.toml
    {{- end }}
    exec "$@" --config=/runtime/config.toml
