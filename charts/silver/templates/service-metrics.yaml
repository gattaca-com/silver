apiVersion: v1
kind: Service
metadata:
  name: {{ include "silver.fullname" . }}-metrics
  labels:
    {{- include "silver.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    {{- with .Values.service.metrics.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.metrics.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.metrics.type }}
  publishNotReadyAddresses: {{ .Values.service.metrics.publishNotReadyAddresses }}
  ports:
    - port: {{ .Values.service.metrics.port }}
      name: metrics
      targetPort: rpc
      protocol: TCP
  selector:
    {{- include "silver.selectorLabels" . | nindent 4 }}
