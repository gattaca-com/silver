apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "silver.fullname" . }}
  labels:
    {{- include "silver.labels" . | nindent 4 }}
spec:
  serviceName: {{ default (include "silver.fullname" .) .Values.serviceName }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
  selector:
    matchLabels:
      {{- include "silver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/entrypoint: {{ include (print $.Template.BasePath "/configmap-entrypoint.yaml") . | sha256sum }}
        kubectl.kubernetes.io/default-container: {{ .Chart.Name }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "silver.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "silver.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.externalIP.enabled }}
      initContainers:
        {{- include "silver.externalIPInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: runtime
              mountPath: /runtime
            - name: entrypoint
              mountPath: /entrypoint
              readOnly: true
            {{- if .Values.externalIP.enabled }}
            - name: external-ip
              mountPath: /network
              readOnly: true
            {{- end }}
            {{- if .Values.jwtSecret.existingSecret }}
            - name: jwt-secret
              mountPath: /jwt-secret
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: LOG_STDOUT
              value: "1"
            - name: XDG_DATA_HOME
              value: /runtime
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /entrypoint/entrypoint.sh
          args:
            - /usr/local/bin/silver
            {{- if .Values.jwtSecret.existingSecret }}
            - --jwt-secret=/jwt-secret/jwt
            {{- end }}
            {{- range $key, $value := .Values.extraArgs }}
            {{- if kindIs "bool" $value }}
            {{- if $value }}
            - --{{ $key }}
            {{- end }}
            {{- else if or (eq $value nil) (eq (toString $value) "") }}
            - --{{ $key }}
            {{- else }}
            - {{ printf "--%s=%s" $key (toString $value) | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: rpc
              containerPort: {{ .Values.service.rpc.port }}
              protocol: TCP
            - name: p2p-udp
              containerPort: {{ .Values.service.p2p.udp.port }}
              protocol: UDP
              {{- if .Values.service.p2p.enableHostPort }}
              hostPort: {{ .Values.service.p2p.udp.port }}
              {{- end }}
            - name: p2p-quic
              containerPort: {{ .Values.service.p2p.quic.port }}
              protocol: UDP
              {{- if .Values.service.p2p.enableHostPort }}
              hostPort: {{ .Values.service.p2p.quic.port }}
              {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: runtime
          emptyDir: {}
        - name: entrypoint
          configMap:
            name: {{ include "silver.fullname" . }}-entrypoint
            defaultMode: 0555
        - name: config
          configMap:
            name: {{ include "silver.fullname" . }}-config
        {{- if .Values.externalIP.enabled }}
        - name: external-ip
          emptyDir: {}
        {{- end }}
        {{- if .Values.jwtSecret.existingSecret }}
        - name: jwt-secret
          secret:
            secretName: {{ .Values.jwtSecret.existingSecret }}
            items:
              - key: {{ .Values.jwtSecret.key }}
                path: jwt
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if eq .Values.persistence.type "emptyDir" }}
        - name: data
          emptyDir: {}
        {{- else if eq .Values.persistence.type "existingClaim" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ tpl .Values.persistence.existingClaim . }}
        {{- else if eq .Values.persistence.type "hostPath" }}
        - name: data
          hostPath:
            path: {{ .Values.persistence.hostPath.path }}
            type: {{ .Values.persistence.hostPath.type }}
        {{- end }}
  {{- if eq .Values.persistence.type "volumeClaimTemplate" }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "silver.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ ternary "" .Values.persistence.storageClass (eq "-" .Values.persistence.storageClass) | quote }}
        {{- end }}
  {{- end }}
