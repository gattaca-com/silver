apiVersion: v1
kind: Service
metadata:
  name: {{ include "silver.fullname" . }}-rpc
  labels:
    {{- include "silver.labels" . | nindent 4 }}
    {{- with .Values.service.rpc.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.rpc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.rpc.type }}
  ports:
    - port: {{ .Values.service.rpc.port }}
      name: rpc
      targetPort: rpc
      protocol: TCP
  selector:
    {{- include "silver.selectorLabels" . | nindent 4 }}
  sessionAffinity: {{ .Values.service.rpc.sessionAffinity }}
  {{- with .Values.service.rpc.sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
