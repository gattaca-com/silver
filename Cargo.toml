[workspace]
members = [
  "crates/beacon_state",
  "crates/bin",
  "crates/common",
  "crates/common_macros",
  "crates/control",
  "crates/data_columns",
  "crates/discovery",
  "crates/e2e",
  "crates/gossip",
  "crates/network",
  "crates/peer",
  "crates/surfer",
]
resolver = "2"

[workspace.package]
edition = "2024"
repository = "https://github.com/gattaca-com/silver"
rust-version = "1.91.0"
version = "0.0.1"

[profile.release-prod]
codegen-units = 1
debug = false
inherits = "release"
lto = "fat"
opt-level = 3
panic = "abort"
split-debuginfo = "off"

[profile.release-alpha]
codegen-units = 1
debug = true
inherits = "release"
lto = true
opt-level = 3
split-debuginfo = "off"

[profile.dev.package."*"]
# Set the default for dependencies in Development mode.
opt-level = 3

[profile.dev]
# Turn on a small amount of optimisation in Development mode.
opt-level = 1

# Release profile used when running locally.
# Build optimised, but with all debug checks enabled.
[profile.release-with-debug]
debug-assertions = true
inherits = "dev"
opt-level = 3

[workspace.dependencies]
silver_beacon_state = { path = "crates/beacon_state" }
silver_common = { path = "crates/common" }
silver_control = { path = "crates/control" }
silver_discovery = {path = "crates/discovery" }
silver_gossip = {path = "crates/gossip" }
silver_network = {path = "crates/network" }
silver_peer = {path = "crates/peer" }
silver_common_macros = { path = "crates/common_macros" }
data_columns = { path = "crates/data_columns" }
flux = { git = "https://github.com/gattaca-com/flux", rev = "f902769fe25915d8e58b50469f4a8b76f6045870"}
flux-utils = { git = "https://github.com/gattaca-com/flux", rev = "f902769fe25915d8e58b50469f4a8b76f6045870", features = ["bytes"]}

# External
backtrace = "0.3"
aes = "0.8"
aes-gcm = "0.10"
alloy-rlp = { version = "0.3.12", default-features = false, features = ["derive", "std"] }
base64 = "0.22"
blst = {version = "0.3", features = ["no-threads"]}
buffa = "0.2.0"
# `ethereum_kzg_settings` feature bundles the mainnet trusted setup as a static
# so callers don't have to ship the ~880 KB JSON file. Default features pin
# `blst/portable` which conflicts with our explicit `blst` selection above;
# pull in c-kzg with default features off and re-enable just what we need.
c-kzg = { version = "2.1", default-features = false, features = [
    "ethereum_kzg_settings",
] }
bytes = "1.11.1"
crc32c = "0.6"
criterion = { version = "0.5.1", features = ["async_std", "async_tokio"] }
crossterm = "0.28"
ctr = "0.9"
fxhash = "0.2.1"
hashtree-rs = "0.2"
hdrhistogram = "7.5.4"
hex = { version = "0.4", features = ["serde"] }
hkdf = "0.12"
libc = "0.2"
mio = { version = "1.0.4", features = ["net", "os-poll"] }
pprof = { version = "0.13", features = ["criterion", "flamegraph"] }
proc-macro2 = "1"
quinn-proto = "0.11.14"
quote = "1"
ratatui = "0.29"
rand = "0.8.5"
rand_core = "0.6.4"
rcgen = "0.14.7"
ring = "0.17"
rustc-hash = "2"
secp256k1 = { version = "0.30", features = ["global-context", "rand", "hashes"] }
rustls = "0.23.37"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10"
sha2-const-stable = "0.1"
sha3 = "0.10"
slab = "0.4.12"
snap = "1.1.1"
syn = { version = "2", features = ["full"] }
thiserror = "1.0.58"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uint = "0.9"
x509-parser = { version = "0.17", features = ["verify"] }
yasna = "0.5"

[workspace.lints.clippy]
too_long_first_doc_paragraph = "allow"
