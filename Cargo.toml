[workspace]
members = [
  "crates/beacon_state/data",
  "crates/beacon_state/tile",
  "crates/bin",
  "crates/common",
  "crates/config",
  "crates/config/chain_spec",
  "crates/control",
  "crates/storage",
  "crates/discovery",
  "crates/e2e",
  "crates/gossip",
  "crates/engine",
  "crates/metrics",
  "crates/network",
  "crates/peer",
  "crates/ssz",
  "crates/surfer", 
  "crates/columns",
]
resolver = "2"

[workspace.package]
edition = "2024"
repository = "https://github.com/gattaca-com/silver"
rust-version = "1.91.0"
version = "0.0.1"

[profile.release-prod]
codegen-units = 1
debug = false
inherits = "release"
lto = "fat"
opt-level = 3
panic = "abort"
split-debuginfo = "off"

[profile.release-alpha]
codegen-units = 1
debug = true
inherits = "release"
lto = true
opt-level = 3
split-debuginfo = "off"

[profile.dev.package."*"]
# Set the default for dependencies in Development mode.
opt-level = 3

[profile.dev]
# Turn on a small amount of optimisation in Development mode.
opt-level = 1

# Release profile used when running locally.
# Build optimised, but with all debug checks enabled.
[profile.release-with-debug]
debug-assertions = true
inherits = "dev"
opt-level = 3

[workspace.dependencies]
silver_beacon_state = { path = "crates/beacon_state/tile" }
silver_beacon_state_data = { path = "crates/beacon_state/data" }
silver_chain_spec = { path = "crates/config/chain_spec" }
silver_columns = { path = "crates/columns" }
silver_common = { path = "crates/common" }
silver_config = { path = "crates/config" }
silver_metrics = { path = "crates/metrics" }
silver_ssz = { path = "crates/ssz" }
silver_control = { path = "crates/control" }
silver_discovery = {path = "crates/discovery" }
silver_gossip = {path = "crates/gossip" }
silver_network = {path = "crates/network" }
silver_peer = {path = "crates/peer" }
silver_storage = { path = "crates/storage" }
silver_engine = { path = "crates/engine"}
flux = { git = "https://github.com/gattaca-com/flux", rev = "b7c6d79db3b28cb62865f338cfe33725ada23600"}
flux-utils = { git = "https://github.com/gattaca-com/flux", rev = "b7c6d79db3b28cb62865f338cfe33725ada23600", features = ["bytes"]}
flux-profiler = { git = "https://github.com/gattaca-com/flux", rev = "b7c6d79db3b28cb62865f338cfe33725ada23600"}

# External
backtrace = "0.3"
aes = "0.8"
aes-gcm = "0.10"
alloy-rlp = { version = "0.3.12", default-features = false, features = ["derive", "std"] }
base64 = "0.22"
blst = {version = "0.3", features = ["no-threads"]}
buffa = "0.2.0"
# `ethereum_kzg_settings` feature bundles the mainnet trusted setup as a static
# so callers don't have to ship the ~880 KB JSON file. Default features pin
# `blst/portable` which conflicts with our explicit `blst` selection above;
# pull in c-kzg with default features off and re-enable just what we need.
c-kzg = { version = "2.1", default-features = false, features = [
    "ethereum_kzg_settings",
] }
bytes = "1.11.1"
crc32c = "0.6"
criterion = { version = "0.5.1", features = ["async_std", "async_tokio"] }
crossterm = "0.28"
ctr = "0.9"
fxhash = "0.2.1"
hashtree-rs = "0.2"
hdrhistogram = "7.5.4"
hex = { version = "0.4", features = ["serde"] }
hkdf = "0.12"
hmac = "0.12"
httparse = "1"
libc = "0.2"
# v2: pin the stable mimalloc 2.x line. The crate defaults to v3, whose
# exit-time `mi_process_done` force-collect races mimalloc's background purge
# thread on the shared arena → SIGSEGV on shutdown. v2 has no such race.
mimalloc = { version = "0.1.52", features = ["v2"] }
mio = { version = "1.0.4", features = ["net", "os-poll"] }
parking_lot = "0.12"
pprof = { version = "0.13", features = ["criterion", "flamegraph"] }
proc-macro2 = "1"
quinn-proto = "0.11.14"
quote = "1"
ratatui = "0.29"
rand = "0.8.5"
rand_core = "0.6.4"
rcgen = "0.14.7"
ring = "0.17"
rustc-hash = "2"
secp256k1 = { version = "0.30", features = ["global-context", "rand", "hashes"] }
rustls = "0.23.37"
serde = { version = "1.0.228", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0.135"
simd-json = "0.17.0"
toml = "0.8"
sha2 = "0.10"
sha2-const-stable = "0.1"
sha3 = "0.10"
slab = "0.4.12"
snap = "1.1.1"
socket2 = "0.5.10"
syn = { version = "2", features = ["full"] }
thiserror = "1.0.58"
tracing = "0.1.40"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uint = "0.9"
x509-parser = { version = "0.17", features = ["verify"] }
yasna = "0.5"

[workspace.lints.clippy]
too_long_first_doc_paragraph = "allow"

